apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi" # mínimo garantido de memória
              cpu: "100m" # mínimo garantido de CPU
            limits:
              memory: "1Gi"  # máximo permitido — se passar, o pod é reiniciado
              cpu: "500m"
      volumes:
        - name: postgres-data # nome do volume usado no volumeMounts acima
          persistentVolumeClaim:
            claimName: postgres-pvc # referencia o pvc que criamos no db-pvc.yml